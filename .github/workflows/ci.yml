name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - run: swift build
      - run: swift test
      # Dogfood: the linter must accept its own sources. The only permitted
      # hits are the no-shape-in-symbol-names rule referring to itself.
      - run: swift run anti-slop Sources Tests --disable=no-shape-in-symbol-names
      # The bundled install-skill assets must stay identical to Sources/.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-skill-assets.mjs --check
